[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reconocimiento-expresiones"
version = "0.1.0"
description = "Proyecto reproducible de clasificación de expresiones faciales con RAF-DB"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6,<3", "torchvision>=0.21,<1", "Pillow>=11,<14",
    "numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2",
    "scikit-image>=0.25,<1", "matplotlib>=3.9,<4", "joblib>=1.4,<2",
    "gdown>=5.2,<7",
    "Flask>=3.1,<4", "opencv-python-headless>=4.11,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
export = ["onnx>=1.23,<2", "onnxruntime>=1.23,<2"]

[project.scripts]
emociones = "emotion_recognition.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
